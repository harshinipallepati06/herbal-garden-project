<!DOCTYPE html>
<html>
<head>
    <title>Herbal Garden</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7f6;
        }
        h4{
            color: black;
        }
        .hero {
    height: 90vh;
    background: url("/static/images/bg.jpg") no-repeat center center/cover;
    position: relative;
    color: white;
    display: flex;
    align-items: center;
}
        .hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
}
.hero .container {
    position: relative;
    z-index: 2;
}
label {
    color: #222;   /* dark text */
    font-weight: 600;
}
.form-select {
    color: black;
    background-color: #fff;
}
        .card-box {
    border-radius: 15px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
}

        .btn-custom {
            background: #2e7d32;
            color: white;
        }

        .btn-custom:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <span class="navbar-brand">🌿 Herbal Garden</span>
    </div>
</nav>

<!-- HERO SECTION -->
<div class="hero">
    <div class="container">

        <div class="row align-items-center">

            <!-- LEFT TEXT -->
            <div class="col-md-6">
                <h1>Natural Healing for Respiratory Care 🌿</h1>
                <p class="mt-3">
                    Discover Ayurvedic remedies tailored to your condition.
                    Get plant recommendations, usage guidance, and nearby doctors.
                </p>
            </div>

            <!-- RIGHT FORM -->
            <div class="col-md-6">
                <div class="card-box">

                    <h4 class="mb-3 text-center">Get Recommendations</h4>

                    <form action="/result" method="post">

                        <div class="mb-3">
    <label>Cough</label>
    <select class="form-select" name="cough">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>
</div>

<div class="mb-3">
    <label>Fever</label>
    <select class="form-select" name="fever">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>
</div>

<div class="mb-3">
    <label>Breathing Difficulty</label>
    <select class="form-select" name="breathing">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>
</div>

                        <div class="mb-3">
                            <label>Location</label>
                            <select class="form-select" name="location" required>
                                <option>Hyderabad</option>
                                <option>Warangal</option>
                                <option>Karimnagar</option>
                            </select>
                        </div>

                        <button class="btn btn-custom w-100">
                            Get Recommendations
                        </button>

                    </form>

                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
